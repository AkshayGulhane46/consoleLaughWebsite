<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Base Meta (overridden per-page by JS) -->
  <title>Akshay's Notes</title>
  <meta name="description" content="Instagram insights expanded into lasting, shareable knowledge." />

  <!-- OG / Social -->
  <meta property="og:title"       content="Akshay's Notes" />
  <meta property="og:description" content="Instagram insights expanded into lasting, shareable knowledge." />
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="" />
  <meta property="og:image"       content="" />

  <!-- Twitter Card -->
  <meta property="twitter:card"        content="summary_large_image" />
  <meta property="twitter:title"       content="Akshay's Notes" />
  <meta property="twitter:description" content="Instagram insights expanded into lasting, shareable knowledge." />

  <!-- Fonts preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="style.css" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="data.js"></script>
  <script type="text/babel" src="utils.js"></script>
  <script type="text/babel" src="components.js"></script>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
