name: Daily Contribution

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily activity
        run: |
          echo "Last updated: $(date -u)" > daily-activity.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-activity.txt
          git commit -m "Daily contribution $(date -u '+%Y-%m-%d')" || echo "No changes to commit"
          git push